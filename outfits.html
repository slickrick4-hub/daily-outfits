<!DOCTYPE html>
<html lang="en"><head>
<meta name='impact-site-verification' value='40dedc20-3281-4b48-90fd-a8295e4541ee'><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outfits on sale</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600&family=Fraunces:ital,wght@0,500;0,700;1,500&display=swap">
<link rel="stylesheet" href="style.css">
</head><body>
<header class="top"><a class="brand" href="outfits.html">Outfits on sale</a><nav><a href="outfits.html" class="on">Outfits</a><a href="quiz.html">Style quiz</a><a href="saved.html">Saved</a></nav></header>
<main>
<h1>Looks on sale today</h1>
<p class="sub" id="meta">Loading the catalog…</p>
<details id="setup" open><summary>Your sizes, budget and taste</summary>
<p class="sub" id="intro" hidden style="margin-top:10px">New here? Enter your sizes and budget, then take the one-minute style quiz so the looks fit your taste.</p>
<div class="grid">
<label>Top size(s)<input id="tops" placeholder="M, L"></label>
<label>Waist size(s), inches<input id="waist" placeholder="30, 31, 32"></label>
<label>Shoe size(s), US<input id="shoe" placeholder="9, 9.5"></label>
<label>Budget per outfit (CAD)<input id="budget" type="number" min="50"></label>
</div>
<details class="adv"><summary>Advanced: words and stores</summary><div class="grid">
<label class="wide">Words you like (colors, styles)<input id="like"></label>
<label class="wide">Words to avoid<input id="avoid"></label>
<label class="wide">Stores to include (tap to turn off)<div class="chips" id="stores"></div></label>
</div></details>
<div class="act"><button id="go">Show my outfits</button><button id="quizgo" class="o">Take the style quiz</button><button id="reset" class="o">Reset</button><button id="unban" class="o" hidden>Bring back removed pieces</button></div>
</details>
<p class="sub" id="count"></p>
<section id="feed"></section>
<div class="act"><button id="more2" hidden>Show more outfits</button><button id="more" class="o" hidden>Shuffle for new ideas</button><button id="share" class="o">Copy link to share</button></div>
<p class="foot"><a href="about.html">About and disclosure</a></p>
</main>
<script>
const $=id=>document.getElementById(id);
const DEF={tops:'M, L',waist:'30, 31, 32',shoe:'9',budget:500,
 like:'oxford, chambray, flannel, stripe, merino, polo, trouser, indigo, black, olive, brown, navy, charcoal, grey, cream, khaki, loafer, derby',
 avoid:'henley, tee, hoodie, jacket, white, sneaker, trainer, boot, sandal, slipper'};
const STOP=new Set(['men','mens','women','womens','the','and','with','for','unisex','final','sale','guy']);
const list=s=>String(s).split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);
const money=n=>'CAD '+Number(n).toFixed(2);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nice=s=>s===s.toUpperCase()?s.toLowerCase().replace(/(^|[\s\/-])\w/g,c=>c.toUpperCase()):s;
const re=w=>new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
const hit=(t,ws)=>ws.filter(w=>re(w).test(t)).length;
const txt=i=>i.title.toLowerCase()+' '+(i.colors||[]).join(' ');
const tok=i=>{const w=new Set((i.title.toLowerCase().match(/[a-z]{3,}/g)||[]).filter(x=>!STOP.has(x)));(i.colors||[]).forEach(c=>w.add(c));return[...w]};
const sum=(a,k)=>a.reduce((n,x)=>n+x[k],0);
const LABEL={top:'Top',bottom:'Bottom',shoes:'Shoes',outerwear:'Layer'};
let CAT=[],SAVED=false,W={},OFF=new Set(),LIKED=new Set(),BANNED=new Set(),POOL=[],OUT=[],SH=0,CUR=DEF;
function load(){let p=Object.assign({},DEF);try{const s=localStorage.getItem('profile');if(s){const q=JSON.parse(s);Object.assign(p,q);SAVED=true;if(typeof p.waist==='number')p.waist=[p.waist-1,p.waist,p.waist+1].join(', ');if(typeof p.shoe==='number')p.shoe=String(p.shoe);W=q.weights||{};OFF=new Set(q.off||[]);LIKED=new Set(q.liked||[]);BANNED=new Set(q.banned||[])}}catch(e){}return p}
function show(p){$('tops').value=p.tops;$('waist').value=p.waist;$('shoe').value=p.shoe;$('budget').value=p.budget;$('like').value=p.like;$('avoid').value=p.avoid}
function read(){return{tops:$('tops').value,waist:$('waist').value.trim()||DEF.waist,shoe:$('shoe').value.trim()||DEF.shoe,budget:+$('budget').value||DEF.budget,like:$('like').value,avoid:$('avoid').value,weights:W,off:[...OFF],liked:[...LIKED],banned:[...BANNED]}}
function save(){try{localStorage.setItem('profile',JSON.stringify(read()))}catch(e){}}
const nums=s=>String(s).split(/[,\s]+/).map(Number).filter(n=>n>0);
function mySizes(i,p){const ss=(i.sizes||[]).map(String);
  if(i.kind==='shoes')return ss.filter(s=>{const m=/^(?:US\s*)?(\d{1,2}(?:\.\d)?)/i.exec(s);return m&&nums(p.shoe).some(v=>Math.abs(+m[1]-v)<.01)});
  if(i.kind==='bottom')return ss.filter(s=>{const m=/^(\d{2})(?:\s*[\/x-]\s*(\d{2}))?$/i.exec(s.trim());return m&&nums(p.waist).includes(+m[1])});
  const want=list(p.tops).map(x=>x.toUpperCase());return ss.filter(s=>want.includes(s.split(' - ')[0].trim().toUpperCase()))}
const DARK=['black','navy','grey'];
function cb(parts){const f=new Set(parts.flatMap(x=>x.colors||[]));if(!f.size)return 0;let b=0;
  if([...f].every(c=>DARK.includes(c)))b-=2.5;if([...f].some(c=>!DARK.includes(c)))b+=1.5;if(f.size>=4)b-=3;if(f.has('bright'))b-=2;return b}
const wsum=i=>Math.max(-6,Math.min(8,tok(i).reduce((a,t)=>a+(W[t]||0),0)));
const mean=a=>a.reduce((n,x)=>n+x,0)/a.length;
const FAM=i=>i.title.toLowerCase().split(/ in | - /)[0].trim();
const PAT=/stripe|plaid|check|gingham|houndstooth|camo|floral|print|paisley/;
function formal(i){const t=i.title.toLowerCase(),k=i.kind;
  if(k==='shoes')return /loafer|derby|derbies|oxfords|brogue|monk|wingtip/.test(t)?4:/boot|chelsea/.test(t)?3:/sneaker|trainer|slip.on|driver|moc/.test(t)?2:3;
  if(k==='bottom')return /trouser|slack|wool/.test(t)?4:/chino/.test(t)?3:/denim|jean|selvedge|selvage/.test(t)?2:/cargo|jogger|sweatpant|track|short/.test(t)?1:3;
  if(k==='outerwear')return /blazer|sportcoat|suit/.test(t)?5:/coat|trench|wool/.test(t)?4:/overshirt|vest|shacket/.test(t)?3:/hood/.test(t)?1:2.5;
  return /\btee\b|hoodie|sweatshirt|henley|tank/.test(t)?1:/oxford|button|chambray|poplin|dress shirt/.test(t)?3.5:/polo/.test(t)?3:2.5}
function layerable(i){const t=i.title.toLowerCase();return /\btee\b|polo|henley|shirt|button|oxford|chambray|flannel|poplin|long.?sleeve/.test(t)&&!/sweater|hoodie|sweatshirt|cardigan|fleece|quarter|zip|crew/.test(t)}
function coh(parts){const f=parts.map(formal),rng=Math.max(...f)-Math.min(...f);let s=-Math.max(0,rng-1.5)*2;
  const pats=parts.filter(x=>PAT.test(x.title.toLowerCase())).length;if(pats>1)s-=3*(pats-1);return s}
function label(parts){const m=mean(parts.map(formal)),c=[...new Set(parts.flatMap(x=>x.colors||[]))].slice(0,3).join(' + ');
  return(m>=3.6?'Dressed up':m>=2.8?'Smart casual':'Casual')+(c?' · '+c:'')}
function build(items,p,shuffle){
  const likeW=list(p.like),avoidW=list(p.avoid);
  const ok=items.filter(i=>!OFF.has(i.store)&&!BANNED.has(i.url)&&i.price_cad<=p.budget&&mySizes(i,p).length&&hit(txt(i),avoidW)===0);
  ok.forEach(i=>{i._s=i.off_pct/20+2*hit(txt(i),likeW)+wsum(i)-(i.final_sale?1:0)+(LIKED.has(i.url)?2:0)+(shuffle?Math.random()*4:0)});POOL=ok;
  const pick=(k,n)=>ok.filter(i=>i.kind===k).sort((a,b)=>b._s-a._s).slice(0,n);
  const tops=pick('top',60),bots=pick('bottom',40),shoes=pick('shoes',30),lay=pick('outerwear',20),base=[];
  for(const t of tops)for(const b of bots)for(const s of(shoes.length?shoes:[null])){
    const parts=[t,b].concat(s?[s]:[]),cost=sum(parts,'price_cad');if(cost>p.budget)continue;
    base.push([mean(parts.map(x=>x._s))+coh(parts)+cb(parts),parts,cost])}
  base.sort((a,b)=>b[0]-a[0]);
  const combos=base.map(x=>[x[0],x[1]]);
  for(const[,parts,cost]of base.slice(0,500)){if(!layerable(parts[0]))continue;
    for(const o of lay)if(cost+o.price_cad<=p.budget){const f=parts.concat([o]);combos.push([mean(f.map(x=>x._s))+coh(f)+cb(f)+.3,f])}}
  combos.sort((a,b)=>b[0]-a[0]);
  const out=[],uT={},uB={},uS={},uL={},seen={};let nl=0;
  for(const[,parts]of combos){const t=parts[0],b=parts[1],s=parts.find(x=>x.kind==='shoes'),o=parts.find(x=>x.kind==='outerwear');
    const ft=FAM(t),fb=FAM(b),fs=s?FAM(s):'',fo=o?FAM(o):'',key=ft+'|'+fb+'|'+fs;
    if(seen[key]||uT[ft]||(uB[fb]||0)>=3||(s&&(uS[fs]||0)>=5)||(o&&((uL[fo]||0)>=3||nl*3>out.length+3)))continue;
    seen[key]=1;uT[ft]=1;uB[fb]=(uB[fb]||0)+1;if(s)uS[fs]=(uS[fs]||0)+1;if(o){uL[fo]=(uL[fo]||0)+1;nl++}
    out.push({parts,label:label(parts)});if(out.length===60)break}
  return out}
const getSaved=()=>{try{return JSON.parse(localStorage.getItem('saved')||'[]')}catch(e){return[]}};
const getPieces=()=>{try{return JSON.parse(localStorage.getItem('pieces')||'{}')}catch(e){return{}}};
const snap=x=>({kind:x.kind,store:x.store,title:x.title,url:x.url,image:x.image,price_cad:x.price_cad,was_cad:x.was_cad});
const okey=parts=>parts.map(x=>x.url).sort().join('|');
const KO={top:0,bottom:1,shoes:2,outerwear:3};
const SLOT={2:{top:[4,4,44,92,-2],bottom:[52,4,44,92,2]},
3:{top:[3,2,52,46,-3],bottom:[38,32,58,64,2],shoes:[3,54,40,42,-2]},
4:{top:[2,2,46,40,-3],outerwear:[52,2,46,40,3],bottom:[36,38,60,60,1],shoes:[2,52,38,44,-2]}};
function flat(parts){const S=SLOT[parts.length]||SLOT[3];
  return '<div class="board">'+parts.map(x=>{const s=S[x.kind]||[0,0,50,50,0];
    return '<a class="slot" style="left:'+s[0]+'%;top:'+s[1]+'%;width:'+s[2]+'%;height:'+s[3]+'%;transform:rotate('+s[4]+'deg)" href="'+esc(x.url)+'" target="_blank" rel="noopener" title="'+esc(nice(x.title))+'"><img src="'+esc(x.image)+'" alt="'+esc(nice(x.title))+'" loading="lazy"></a>'}).join('')+'</div>'}
function card(o,n){const parts=o.parts,tot=sum(parts,'price_cad'),was=sum(parts,'was_cad');
  return '<article class="outfit" data-n="'+n+'">'+flat(parts)+'<ul>'+
    parts.map((x,k)=>'<li><div><span>'+LABEL[x.kind]+' · '+esc(x.store)+'</span><a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(nice(x.title))+'</a>'+(x.final_sale?'<i class="fs">final sale</i>':'')+'<em>Your size in stock: '+esc(mySizes(x,CUR).join(', '))+'</em></div><b>'+money(x.price_cad)+'</b>'+
      '<div class="pc"><button type="button" class="pb'+(LIKED.has(x.url)?' on':'')+'" data-o="'+n+'" data-k="'+k+'" data-v="1">'+(LIKED.has(x.url)?'♥ Loved':'♡ Love')+'</button><button type="button" class="pb" data-o="'+n+'" data-k="'+k+'" data-v="-1">✕ Swap this piece</button></div></li>').join('')+
    '</ul><p class="tot">'+money(tot)+'<s>'+money(was)+'</s>you save '+money(was-tot)+'</p><div class="pc"><button type="button" class="pb sv" data-n="'+n+'">'+(getSaved().some(s=>s.key===okey(parts))?'♥ Saved':'♡ Save this look')+'</button></div></article>'}
function redraw(n){const el=document.querySelector('.outfit[data-n="'+n+'"]');if(el)el.outerHTML=card(OUT[n],n)}
function swap(n,k){const o=OUT[n],old=o.parts[k],rest=o.parts.filter((_,i)=>i!==k),hasLayer=rest.some(x=>x.kind==='outerwear');
  const used=new Set(OUT.flatMap(q=>q.parts.map(x=>x.url))),fams=new Set(OUT.flatMap(q=>q.parts.filter(x=>x.kind===old.kind).map(FAM))),base=sum(rest,'price_cad');
  const find=strict=>{let best=null,bs=-1e9;
    for(const c of POOL){if(c.kind!==old.kind||BANNED.has(c.url)||base+c.price_cad>CUR.budget)continue;
      if(strict&&(used.has(c.url)||fams.has(FAM(c))))continue;
      if(old.kind==='top'&&hasLayer&&!layerable(c))continue;
      const f=rest.concat([c]),s=mean(f.map(x=>x._s))+coh(f)+cb(f);if(s>bs){bs=s;best=c}}
    return best};
  const best=find(true)||find(false);
  if(best)o.parts=rest.concat([best]).sort((a,b)=>KO[a.kind]-KO[b.kind]);
  else if(old.kind==='outerwear')o.parts=rest;
  else{const el=document.querySelector('.outfit[data-n="'+n+'"]');if(el)el.style.display='none';return}
  o.label=label(o.parts);redraw(n)}
function updBan(){$('unban').hidden=!BANNED.size;$('unban').textContent='Bring back '+BANNED.size+' removed pieces'}
function showMore(){const next=OUT.slice(SH,SH+12);$('feed').insertAdjacentHTML('beforeend',next.map((o,k)=>card(o,SH+k)).join(''));SH+=next.length;
  $('count').textContent='Showing '+SH+' of '+OUT.length+' outfits';$('more2').hidden=SH>=OUT.length}
function run(shuffle){const p=read();CUR=p;save();OUT=build(CAT,p,shuffle);SH=0;$('feed').innerHTML='';
  if(!OUT.length){$('feed').innerHTML='<p class="sub">No outfits fit right now. Try a bigger budget, fewer words to avoid, more stores, or check back tomorrow when new sales arrive.</p>';
    $('more').hidden=true;$('more2').hidden=true;$('count').textContent='';$('setup').open=true;return}
  showMore();$('more').hidden=false;$('setup').open=false}
function chips(){const n={};CAT.forEach(i=>n[i.store]=(n[i.store]||0)+1);
  $('stores').innerHTML=Object.keys(n).sort().map(s=>'<button type="button" class="chip'+(OFF.has(s)?'':' on')+'" data-s="'+esc(s)+'">'+esc(s)+' ('+n[s]+')</button>').join('')}
$('stores').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const s=b.dataset.s;OFF.has(s)?OFF.delete(s):OFF.add(s);b.classList.toggle('on');save()};
$('feed').onclick=e=>{const sv=e.target.closest('.sv');if(sv){const n=+sv.dataset.n,parts=OUT[n].parts,key=okey(parts);let L=getSaved();const i=L.findIndex(s=>s.key===key);
  if(i>=0)L.splice(i,1);else L.unshift({key,t:Date.now(),parts:parts.map(snap)});try{localStorage.setItem('saved',JSON.stringify(L.slice(0,100)))}catch(err){}redraw(n);return}
  const b=e.target.closest('.pb');if(!b)return;const n=+b.dataset.o,k=+b.dataset.k,v=+b.dataset.v,x=OUT[n].parts[k];
  const bump=(it,d)=>tok(it).forEach(t=>{W[t]=Math.max(-3,Math.min(3,(W[t]||0)+d))});
  if(v>0){const P=getPieces();if(LIKED.has(x.url)){LIKED.delete(x.url);bump(x,-1);delete P[x.url]}else{LIKED.add(x.url);bump(x,1);P[x.url]=snap(x)}try{localStorage.setItem('pieces',JSON.stringify(P))}catch(err){}save();redraw(n);return}
  BANNED.add(x.url);LIKED.delete(x.url);bump(x,-1.5);save();updBan();swap(n,k)};
$('go').onclick=()=>run(false);$('quizgo').onclick=()=>{save();location.href='quiz.html'};$('share').onclick=()=>{const u=location.origin+location.pathname;try{navigator.clipboard.writeText(u);$('share').textContent='Link copied'}catch(e){prompt('Copy this link',u)}};$('more2').onclick=showMore;$('more').onclick=()=>{run(true);window.scrollTo(0,0)};
$('reset').onclick=()=>{try{localStorage.removeItem('profile')}catch(e){}W={};OFF=new Set();LIKED=new Set();BANNED=new Set();show(DEF);chips();updBan()};
$('unban').onclick=()=>{BANNED=new Set();save();updBan();run(false)};
show(load());updBan();
fetch('data/catalog.json?'+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(c=>{CAT=c.items;chips();
  $('meta').textContent=CAT.length+' men’s sale items, updated '+new Date(c.generated_at).toLocaleDateString(undefined,{month:'long',day:'numeric'});
  if(SAVED){$('setup').open=false;run(false)}else{$('intro').hidden=false}
}).catch(()=>{$('meta').textContent='Couldn’t load the catalog. Open this page from your GitHub Pages address, not as a file on your computer.'});
</script></body></html>
