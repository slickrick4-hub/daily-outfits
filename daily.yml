name: Daily sales

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-sales
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python collect_sales.py
      - run: python filter_sales.py
      - run: python build_outfit.py
      - run: python make_catalog.py
      - run: python pick_images.py
      - name: Save results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/sales.json data/filtered.json data/outfit.json data/catalog.json data/image_cache.json
          if git diff --cached --quiet; then echo "No changes to save"; exit 0; fi
          git commit -m "Update sales"
          for i in 1 2 3; do
            if git pull --rebase origin ${{ github.ref_name }} && git push; then exit 0; fi
            echo "Push failed, retrying..."
            sleep 5
          done
          exit 1
