<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Style quiz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600&family=Fraunces:ital,wght@0,500;0,700;1,500&display=swap">
<link rel="stylesheet" href="style.css">
</head><body>
<header class="top"><a class="brand" href="outfits.html">Outfits on sale</a><nav><a href="outfits.html">Outfits</a><a href="quiz.html" class="on">Style quiz</a><a href="saved.html">Saved</a></nav></header>
<main>
<h1>Find your style</h1>
<p class="sub" id="sub">Pick the one you’d rather wear. It uses what’s on sale right now.</p>
<div class="bar"><i id="pg"></i></div>
<section id="pair" class="pair"></section>
<div class="act" id="acts"><button class="o" id="skip">Neither</button></div>
<section id="res" hidden></section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nice=s=>s===s.toUpperCase()?s.toLowerCase().replace(/(^|[\s\/-])\w/g,c=>c.toUpperCase()):s;
const STOP=new Set(['men','mens','women','womens','the','and','with','for','unisex','final','sale','guy']);
const SEQ=['top','bottom','top','shoes','top','bottom','outerwear','shoes'];let ROUNDS=16;
let CAT=[],FREQ={},used=new Set(),score={},count={},r=0,cur=null;
const tok=i=>{const w=new Set((i.title.toLowerCase().match(/[a-z]{3,}/g)||[]).filter(x=>!STOP.has(x)&&FREQ[x]>=4));(i.colors||[]).forEach(c=>w.add(c));return[...w]};
function nextPair(){for(let k=0;k<SEQ.length;k++){const kind=SEQ[(r+k)%SEQ.length];
  const pool=CAT.filter(i=>i.kind===kind&&i.image&&!used.has(i.url));if(pool.length<2)continue;
  const a=pool[Math.floor(Math.random()*pool.length)],ta=new Set(tok(a));let best=null,bd=-1;
  for(let n=0;n<10;n++){const b=pool[Math.floor(Math.random()*pool.length)];if(b===a)continue;const d=tok(b).filter(x=>!ta.has(x)).length;if(d>bd){bd=d;best=b}}
  if(best)return[a,best]}return null}
function draw(){$('pg').style.width=(r/ROUNDS*100)+'%';if(r>=ROUNDS)return finish();
  cur=nextPair();if(!cur)return finish();cur.forEach(i=>used.add(i.url));
  $('pair').innerHTML=cur.map((i,n)=>'<button class="pick" data-n="'+n+'"><img src="'+esc(i.image)+'" alt=""><span>'+esc(nice(i.title))+'</span></button>').join('');
  document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>choose(+b.dataset.n))}
function choose(n){tok(cur[n]).forEach(t=>{score[t]=(score[t]||0)+1;count[t]=(count[t]||0)+1});
  tok(cur[1-n]).forEach(t=>{score[t]=(score[t]||0)-1;count[t]=(count[t]||0)+1});r++;draw()}
function finish(){$('pair').hidden=true;$('acts').hidden=true;$('pg').style.width='100%';
  const ks=Object.keys(score);
  const like=ks.filter(t=>score[t]>=2).sort((a,b)=>score[b]-score[a]).slice(0,12);
  const avoid=ks.filter(t=>score[t]<=-2&&count[t]>=3).sort((a,b)=>score[a]-score[b]).slice(0,8);
  $('sub').textContent='';
  $('res').hidden=false;
  $('res').innerHTML='<h2>Your style</h2><p class="sub">Built from your '+r+' choices. You can edit these words on the outfits page.</p>'+
   '<p class="sub">You gravitate toward</p><div class="chips l">'+(like.length?like.map(t=>'<b class="tag">'+esc(t)+'</b>').join(''):'<span class="sub">Nothing stood out yet. Try again with more choices.</span>')+'</div>'+
   '<p class="sub">You tend to skip</p><div class="chips a">'+(avoid.length?avoid.map(t=>'<b class="tag">'+esc(t)+'</b>').join(''):'<span class="sub">Nothing strong.</span>')+'</div>'+
   '<div class="act"><button id="use">Use this style</button><button class="o" id="keep">Keep going (8 more)</button><button class="o" id="again">Retake</button></div>';
  $('use').onclick=()=>{let p={};try{p=JSON.parse(localStorage.getItem('profile')||'{}')}catch(e){}
    p.like=like.join(', ');p.avoid=avoid.join(', ');const w={};ks.forEach(t=>{if(count[t]>=2&&score[t]!==0)w[t]=Math.max(-3,Math.min(3,score[t]*.5))});p.weights=w;try{localStorage.setItem('profile',JSON.stringify(p))}catch(e){}location.href='outfits.html'};
  $('keep').onclick=()=>{ROUNDS+=8;$('res').hidden=true;$('pair').hidden=false;$('acts').hidden=false;$('sub').textContent='Pick the one you’d rather wear.';draw()};
  $('again').onclick=()=>location.reload()}
$('skip').onclick=()=>{r++;draw()};
fetch('data/catalog.json?'+Date.now()).then(x=>{if(!x.ok)throw 0;return x.json()}).then(c=>{CAT=c.items;
  CAT.forEach(i=>new Set(i.title.toLowerCase().match(/[a-z]{3,}/g)||[]).forEach(w=>FREQ[w]=(FREQ[w]||0)+1));draw()
}).catch(()=>{$('sub').textContent='Couldn’t load the catalog. Open this page from your GitHub Pages address, not as a file on your computer.'});
</script></body></html>
