name: Find new stores

on:
  schedule:
    - cron: "0 9 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-sales
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python discover.py
      - name: Save results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add stores.json rejected.json
          if git diff --cached --quiet; then echo "No changes to save"; exit 0; fi
          git commit -m "Update store list"
          for i in 1 2 3; do
            if git pull --rebase origin ${{ github.ref_name }} && git push; then exit 0; fi
            echo "Push failed, retrying..."
            sleep 5
          done
          exit 1
