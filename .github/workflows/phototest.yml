name: Photo tagging test

# One-off test of FashionCLIP photo tagging. Run it from the Actions tab.
# It changes nothing on the site: results are saved as a downloadable artifact for 7 days.
on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many photos to tag"
        default: "300"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu   # CPU-only build, much smaller
      - run: pip install pillow transformers
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: fashion-clip-v1
      - run: python tag_photos.py --test ${{ inputs.count }}
      - uses: actions/upload-artifact@v4
        with:
          name: photo-test
          path: test_out/
          retention-days: 7
