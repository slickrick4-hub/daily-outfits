name: Photo tagging test

# Tests FashionCLIP photo tagging. Run it from the Actions tab.
# It changes nothing on the site: results are saved as a downloadable artifact for 7 days.
#   mode "sheets": tags a sample and makes contact sheets to check by eye
#   mode "daily":  runs the daily tagging on the real catalog and saves the tagged catalog
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "sheets or daily"
        default: "daily"
      count:
        description: "sheets mode: how many photos"
        default: "300"
      minutes:
        description: "daily mode: time limit"
        default: "25"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu   # CPU-only build, much smaller
      - run: pip install pillow "transformers<5"   # 5.x changed what get_*_features returns
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: fashion-clip-v1
      - if: inputs.mode == 'sheets'
        run: python tag_photos.py --test ${{ inputs.count }}
      - if: inputs.mode == 'daily'
        run: |
          python tag_photos.py --minutes ${{ inputs.minutes }}
          mkdir -p test_out && cp data/catalog.json data/photo_tags.json test_out/
      - uses: actions/upload-artifact@v4
        with:
          name: photo-test
          path: test_out/
          retention-days: 7
