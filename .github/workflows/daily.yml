name: Daily sales

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-sales
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pillow
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: fashion-clip-v1
      - run: python collect_sales.py
      - run: python shopping_search.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      - run: python filter_sales.py
      - run: python build_outfit.py
      - run: python make_catalog.py
      - run: python pick_images.py
      # photo tagging (FashionCLIP): colour, pattern and shape from each new photo, remembered in
      # data/photo_tags.json. If anything here fails, the day's sales still go out without new tags.
      - name: Tag new photos
        continue-on-error: true
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers<5"
          python tag_photos.py --minutes 20
      - name: Save results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/sales.json data/filtered.json data/outfit.json data/catalog.json data/image_cache.json data/shopping_cache.json
          if [ -f data/photo_tags.json ]; then git add data/photo_tags.json; fi
          if git diff --cached --quiet; then echo "No changes to save"; exit 0; fi
          git commit -m "Update sales"
          for i in 1 2 3; do
            if git pull --rebase origin ${{ github.ref_name }} && git push; then exit 0; fi
            echo "Push failed, retrying..."
            sleep 5
          done
          exit 1
